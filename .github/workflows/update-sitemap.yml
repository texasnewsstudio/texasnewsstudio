name: Automatically update sitemap
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tns-sitemap-main
  cancel-in-progress: false
jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sitemap
        run: python scripts/generate_sitemap.py
      - name: Commit sitemap if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap already current"
            exit 0
          fi
          git config user.name "TNS Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automatically refresh sitemap for published pages"
          # Other publishing jobs may update main while this workflow runs.
          # Rebase and retry instead of failing on a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Sitemap rebase conflict; manual review needed"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Sitemap published"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 3))
          done
          echo "Could not push sitemap after five attempts"
          exit 1
