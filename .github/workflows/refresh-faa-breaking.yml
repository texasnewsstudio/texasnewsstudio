name: Refresh FAA breaking headlines
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_faa_news.py
      - name: Commit updated feeds
        run: |
          if ! git diff --quiet -- data/faa-breaking-feed.json; then
            git config user.name "TNS News Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/faa-breaking-feed.json
            git commit -m "Refresh FAA breaking news links"
            git push
          fi
