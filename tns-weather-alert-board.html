<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNS Weather Alert System</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#061d36;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:5px}.board{border:4px solid #eaf4ff;border-radius:17px;background:#061b34;padding:8px 12px 10px;box-shadow:inset 0 0 0 2px #527da0;max-width:1100px;margin:auto}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(#fff,#d8e6ee);color:#a52528;border:2px solid #8cb3ce;border-radius:10px;padding:7px 16px;min-height:52px}.brand{font-weight:950;font-size:clamp(19px,3.3vw,35px);letter-spacing:-.8px;line-height:1.05;text-transform:uppercase;text-shadow:1px 1px #e6a2a2;white-space:nowrap}.brand .tns{border:3px solid #b3272d;padding:0 5px;margin-right:6px;letter-spacing:-1px}.clock{font-size:clamp(13px,1.8vw,22px);font-weight:900;color:#092b4c;white-space:nowrap}.table{margin:5px 2px 0;border:2px solid #9ebed6;border-radius:7px;overflow:hidden}.cols,.alert{display:grid;grid-template-columns:19% 1fr 23%;align-items:center}.cols{background:linear-gradient(#fff,#dcecf5);color:#152637;font-size:13px;font-weight:900;min-height:25px;padding:0 10px}.cols span:nth-child(2){text-align:center}.cols span:last-child{text-align:right}.alert{min-height:49px;padding:3px 10px;gap:7px;background:linear-gradient(180deg,#920007,#590003);border-bottom:1px solid #26060a}.alert.tstorm{background:linear-gradient(180deg,#17578a,#07345d)}.alert.flood{background:linear-gradient(180deg,#125c79,#073d61)}.alert.watch{background:linear-gradient(180deg,#8d4a00,#5c2900)}.alert.other{background:linear-gradient(180deg,#394b68,#182d4b)}.issued,.until{color:#f6d99b;font-size:clamp(11px,1.6vw,18px);font-weight:800;white-space:nowrap}.until{text-align:right}.details{display:flex;align-items:center;gap:12px;min-width:0}.symbol{display:flex;align-items:center;justify-content:center;flex:none;width:37px;height:36px;background:#10151b;color:#fff;font-size:27px;font-weight:900}.tstorm .symbol{background:#5a228d}.flood .symbol{background:#286b9a}.type{font-size:clamp(14px,2.35vw,24px);font-weight:950;line-height:1.03;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.area{font-size:clamp(10px,1.55vw,15px);font-weight:800;color:#f1dfd5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert a{color:inherit;text-decoration:none;min-width:0}.status{font-size:12px;text-align:center;color:#c9deec;padding:6px 2px 0}.empty{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;background:#103b59;font-weight:800;padding:18px}.alert:last-child{border:0}@media(max-width:650px){.board{padding:5px}.mast{padding:7px}.brand{font-size:clamp(13px,3.3vw,23px)}.brand .tns{border-width:2px;margin-right:3px}.clock{font-size:11px}.cols,.alert{grid-template-columns:17% 1fr 19%;padding-left:5px;padding-right:5px}.cols{font-size:10px}.alert{min-height:47px;gap:3px}.details{gap:5px}.symbol{width:23px;height:28px;font-size:18px}.type{font-size:clamp(11px,2.6vw,17px)}.area{font-size:10px}.issued,.until{font-size:10px}}
</style></head><body><div class="board"><header class="mast"><div class="brand"><span class="tns">TNS</span> WEATHER ALERT SYSTEM</div><time class="clock" id="clock">--:--:--</time></header><div class="table"><div class="cols"><span>TIME ISSUED</span><span>TYPE</span><span>UNTIL</span></div><div id="rows"><div class="empty">Connecting to the National Weather Service…</div></div></div><div class="status" id="status" role="status">Live NWS alerts · Updated every 2 minutes · Times Central</div></div><script>
function reportBoardHeight(){const board=document.querySelector('.board');const height=Math.ceil(board.getBoundingClientRect().bottom+5);if(window.parent!==window)window.parent.postMessage({type:'tns-alert-board-height',height},window.location.origin)}
if('ResizeObserver' in window)new ResizeObserver(reportBoardHeight).observe(document.querySelector('.board'));window.addEventListener('load',reportBoardHeight);window.addEventListener('resize',reportBoardHeight);
const rows=document.getElementById('rows'),status=document.getElementById('status'),clock=document.getElementById('clock');
const tz='America/Chicago';function stamp(t,seconds=false){if(!t)return '—';const d=new Date(t);if(isNaN(+d))return '—';return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{}),hour12:true}).format(d).replace(' AM',' A').replace(' PM',' P')}
function tick(){clock.textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date())+' CT'}tick();setInterval(tick,1000);
const kinds=[['Tornado Warning',0,'tornado','🌪'],['Extreme Wind Warning',1,'tornado','!'],['Flash Flood Warning',2,'flood','≋'],['Severe Thunderstorm Warning',3,'tstorm','ϟ'],['Tornado Watch',4,'watch','🌪'],['Severe Thunderstorm Watch',5,'watch','ϟ']];
function classify(e){const found=kinds.find(x=>e===x[0]);return found||[e,8,'other','!']}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function paint(features){rows.replaceChildren();if(!features.length){rows.append(el('div','empty','NO ACTIVE TORNADO, SEVERE THUNDERSTORM OR FLASH FLOOD WARNINGS / WATCHES'));return}
for(const f of features.slice(0,6)){const p=f.properties||{},[name,rank,kind,sym]=classify(p.event||'Weather Alert');const row=el('div','alert '+kind),issued=el('div','issued',stamp(p.sent||p.effective)),details=el('div','details'),icon=el('div','symbol',sym),link=el('a');link.href=p['@id']||p.id||'https://www.weather.gov/alerts';link.target='_blank';link.rel='noopener noreferrer';link.append(el('div','type',name.toUpperCase()),el('div','area',(p.areaDesc||'Location unavailable').replace(/;/g,' · ')));details.append(icon,link);const until=el('div','until',stamp(p.ends||p.expires));row.append(issued,details,until);rows.append(row)}}
async function refresh(){try{const response=await fetch('https://api.weather.gov/alerts/active?status=actual',{headers:{Accept:'application/geo+json'},cache:'no-store'});if(!response.ok)throw Error('NWS service '+response.status);const data=await response.json();const now=Date.now();const features=(data.features||[]).filter(f=>{const p=f.properties||{};return kinds.some(x=>x[0]===p.event)&&(!p.ends||Date.parse(p.ends)>now)&&(!p.expires||Date.parse(p.expires)>now)}).sort((a,b)=>classify(a.properties.event)[1]-classify(b.properties.event)[1]||Date.parse(b.properties.sent||0)-Date.parse(a.properties.sent||0));paint(features);status.textContent='NWS LIVE ALERTS · '+features.length+' qualifying active nationwide · Last checked '+stamp(new Date().toISOString())+' CT · Click a warning for details'}catch(e){rows.replaceChildren(el('div','empty','LIVE NWS ALERT FEED TEMPORARILY UNAVAILABLE'));status.textContent='Unable to verify current alerts · Retrying automatically'}}refresh();setInterval(refresh,120000);
</script></body></html>
