<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNS TEXAS TEMPERATURES — TERRAIN EDITION</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0c1c2b;color:#fff;font-family:Arial,sans-serif}.head{height:67px;background:linear-gradient(100deg,#081929,#1a3b56);border-top:4px solid #e83954;display:flex;align-items:center;justify-content:space-between;padding:7px 17px;gap:8px}.brand{text-align:center;font-weight:1000;font-size:clamp(13px,2vw,23px);line-height:1.05}.brand span{color:#ff6173}.title{text-align:center;font-weight:950;font-size:clamp(15px,2vw,26px)}.subtitle{text-align:center;font-size:10px;color:#bad3e6;margin-top:4px}.map{height:calc(100% - 100px);background:#465a6b}.status{height:33px;background:#0b2438;display:flex;align-items:center;justify-content:center;padding:4px 10px;text-align:center;font-size:12px;color:#d2e4f3}.leaflet-container{background:#607283}.leaflet-control-attribution{font-size:8px!important}.temp-label{background:transparent!important;border:0!important;box-shadow:none!important}.temp-label div{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 1px 2px #081522)}.temp-label b{font-size:clamp(14px,1.8vw,24px);color:#fff;background:#112c46db;padding:2px 5px;border-radius:5px;line-height:1.1}.temp-label small{font-size:10px;font-weight:900;color:white;text-shadow:0 1px 3px #000}.embed .head{height:51px;padding:4px 7px}.embed .brand{font-size:12px}.embed .title{font-size:14px}.embed .subtitle{display:none}.embed .map{height:calc(100% - 77px)}.embed .status{height:26px;font-size:10px}.head{background:#061b35!important;border-top:4px solid #bb1839!important;border-bottom:1px solid #477299!important}.brand{font-family:Arial Black,Arial,sans-serif!important;font-weight:1000!important;color:#fff!important;letter-spacing:.2px!important;text-shadow:0 2px 2px #0009!important}.brand span{color:#fff!important}.title{color:#fff!important;font-family:Arial Black,Arial,sans-serif!important;font-weight:1000!important;letter-spacing:.4px!important;text-shadow:0 2px 2px #0008!important}.subtitle{color:#f2f7ff!important;font-weight:800!important}.status{background:#071d37!important;color:#fff!important;font-weight:700!important;border-top:1px solid #49749c!important}</style><style id="tns-centered-map-titles">.head{display:flex!important;justify-content:center!important;align-items:center!important;text-align:center!important;padding-left:10px!important;padding-right:10px!important}.map-heading{width:100%;min-width:0;text-align:center}.map-heading .title{font-family:Arial,Helvetica,sans-serif!important;font-size:clamp(20px,2.15vw,31px)!important;line-height:1.08!important;letter-spacing:.6px!important;font-weight:950!important;white-space:nowrap!important}.map-heading .subtitle{font-size:11px!important;letter-spacing:.65px!important;margin-top:5px!important}.embed .map-heading .title{font-size:clamp(16px,1.55vw,22px)!important}.embed .map-heading .subtitle{font-size:9px!important;margin-top:3px!important}@media(max-width:600px){.map-heading .title{font-size:19px!important}.embed .map-heading .title{font-size:17px!important}}</style><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><style>

.temp-label b{font-family:Arial Black,Arial,sans-serif!important;font-size:clamp(17px,1.8vw,24px)!important;background:#10263bdf!important;border:1px solid #ffffff80}

#tns-temp-scale{position:absolute;bottom:38px;left:14px;z-index:750;background:#0a1d30e8;color:white;padding:7px 10px;border-radius:5px;font:800 10px Arial;pointer-events:none}
#tns-temp-scale .gradient{height:11px;width:160px;margin:5px 0;background:linear-gradient(90deg,#2f5aaf,#43a4c4,#55bb8b,#dccb4f,#eb943c,#d3483b)}

</style><style>
.tns-regional-city{background:transparent!important;border:0!important;pointer-events:none!important}.tns-regional-city span{font:900 16px Arial,sans-serif;color:#fff;text-shadow:1px 1px 2px #091728,-1px -1px 2px #091728,1px -1px 2px #091728,-1px 1px 2px #091728;white-space:nowrap}
#wpcMapStatus{display:none!important}
.tns-state-abbr{background:transparent!important;border:0!important;pointer-events:none!important}
.tns-state-abbr span{display:block;text-align:center;color:rgba(244,249,255,.60);font:800 17px Arial,sans-serif;letter-spacing:2px;text-shadow:0 1px 3px #06101c,0 0 7px #06101c;white-space:nowrap}
</style></head><body><header class="head"><div class="map-heading"><div class="title" id="tns-mode-title">TEXAS TEMPERATURES</div><div class="subtitle" id="tns-mode-subtitle">LIVE NWS OBSERVATIONS • FAHRENHEIT</div></div></header><div id="map" class="map"></div><div id="tns-temp-scale"><div class="scale-title">TEMPERATURES</div><div class="gradient"></div><div class="numbers"></div></div><div class="status">Connecting to weather data…</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const qs=new URLSearchParams(location.search);if(qs.has('embed'))document.documentElement.classList.add('embed');
const status=document.querySelector('.status');
const map=L.map('map',{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,attributionControl:true}).fitBounds([[25.2,-108.4],[38.1,-90.6]],{padding:[8,8]});
// TNS cinematic terrain: actual satellite imagery + relief shading below live NWS observations.
const terrainImagery=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:13,attribution:'Imagery: Esri',crossOrigin:true}).addTo(map);
const relief=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{maxZoom:13,opacity:.38,attribution:'Relief: Esri'}).addTo(map);
// Gentle darkening improves contrast for white station labels without hiding mountains or coastlines.
const terrainTint=L.rectangle([[10,-140],[55,-65]],{stroke:false,fillColor:'#071b30',fillOpacity:.14,interactive:false}).addTo(map);
terrainTint.bringToBack();terrainImagery.bringToBack();
const boundaryLayer=L.layerGroup().addTo(map);
const nearbyStateLayer=L.layerGroup().addTo(map);
const nearbyStateLabels=L.layerGroup().addTo(map);
const nearbyStateCenters=[['NM',34.35,-105.5],['OK',35.7,-99.3],['AR',34.85,-93.5],['LA',31.3,-92.5],['KS',38.4,-98.9],['CO',38.7,-105.6],['MO',37.65,-92.8]];
function showNearbyStateLabels(){
 nearbyStateLabels.clearLayers();
 for(const [abbr,lat,lon] of nearbyStateCenters){
  L.marker([lat,lon],{interactive:false,zIndexOffset:-1000,icon:L.divIcon({className:'tns-state-abbr',html:'<span>'+abbr+'</span>',iconSize:[38,22],iconAnchor:[19,11]})}).addTo(nearbyStateLabels);
 }
}
showNearbyStateLabels();
let texasGeometry=null,temperatureData=[];
let observationData=[],activeMode=0;
const modes=[
 {name:'TEXAS TEMPERATURES',sub:'LIVE NWS OBSERVATIONS • °F',key:'f',unit:'°',stops:[[35,[47,90,175]],[50,[67,164,196]],[60,[85,187,139]],[70,[220,203,79]],[80,[235,148,60]],[90,[211,72,59]],[105,[137,43,100]]]},
 {name:'TEXAS DEW POINTS',sub:'LIVE NWS OBSERVATIONS • °F',key:'dew',unit:'°',stops:[[20,[157,113,72]],[35,[220,181,87]],[45,[112,185,112]],[55,[60,176,165]],[65,[45,125,202]],[75,[129,74,195]]]},
 {name:'TEXAS HUMIDITY',sub:'LIVE NWS OBSERVATIONS • RELATIVE HUMIDITY',key:'rh',unit:'%',stops:[[10,[174,114,60]],[30,[229,179,77]],[50,[154,189,99]],[70,[73,173,164]],[90,[48,105,189]],[100,[94,73,160]]]},
 {name:'TEXAS FEELS LIKE',sub:'REPORTED NWS APPARENT TEMPERATURE • °F',key:'feels',unit:'°',stops:[[20,[47,90,175]],[35,[67,164,196]],[50,[85,187,139]],[65,[220,203,79]],[80,[235,148,60]],[95,[211,72,59]],[110,[137,43,100]]]}
];
function setMode(index){
 activeMode=index%modes.length;
 const m=modes[activeMode];
 document.getElementById('tns-mode-title').textContent=m.name;
 document.getElementById('tns-mode-subtitle').textContent=m.sub;
 temperatureData=observationData.filter(x=>Number.isFinite(x[m.key])).map(x=>({...x,f:x[m.key]}));
 drawTemperatureGradient();
 markers.clearLayers();
 for(const x of temperatureData){
  const content='<div><b>'+Math.round(x.f)+m.unit+'</b></div>';
  L.marker([x.lat,x.lon],{icon:L.divIcon({className:'temp-label',html:content,iconSize:[56,28],iconAnchor:[28,14]}),interactive:false}).addTo(markers);
 }
 const scale=document.getElementById('tns-temp-scale');
 if(scale){
  scale.querySelector('.scale-title').textContent=m.name.replace('TEXAS ','');
  const gradient=m.stops.map((v,i)=>`rgb(${v[1].join(',')}) ${i*100/(m.stops.length-1)}%`).join(',');
  scale.querySelector('.gradient').style.background='linear-gradient(90deg,'+gradient+')';
  scale.querySelector('.numbers').innerHTML=m.stops.map(v=>'<span>'+v[0]+'</span>').join('');
 }
 const count=temperatureData.length;
 status.textContent=count?`${count} fresh NWS observations • ${activeMode===3?'Reported apparent temperatures only':'Observed station values'} • Rotates every 10 sec`:'Recent observations unavailable for this layer';
}
setInterval(()=>setMode(activeMode+1),10000);

const heatCanvas=document.createElement('canvas');
const gradientPane=map.createPane('tnsGradientPane');
gradientPane.style.zIndex='350';gradientPane.style.pointerEvents='none';
heatCanvas.style.cssText='position:absolute;left:0;top:0;pointer-events:none;opacity:.88';
gradientPane.appendChild(heatCanvas);
function drawTemperatureGradient(){
 const size=map.getSize(),dpr=Math.min(2,window.devicePixelRatio||1);
 // Keep canvas aligned with Leaflet's moving map pane.
 const pos=map.containerPointToLayerPoint([0,0]);
 heatCanvas.style.left=pos.x+'px';heatCanvas.style.top=pos.y+'px';
 heatCanvas.width=Math.max(1,Math.round(size.x*dpr));heatCanvas.height=Math.max(1,Math.round(size.y*dpr));
 heatCanvas.style.width=size.x+'px';heatCanvas.style.height=size.y+'px';
 const ctx=heatCanvas.getContext('2d');ctx.scale(dpr,dpr);
 if(temperatureData.length<4||!texasGeometry)return;
 const scale=.36,w=Math.ceil(size.x*scale),h=Math.ceil(size.y*scale);
 const buffer=document.createElement('canvas');buffer.width=w;buffer.height=h;
 const bc=buffer.getContext('2d'),im=bc.createImageData(w,h);
 const pts=temperatureData.map(p=>({...p,pt:map.latLngToContainerPoint([p.lat,p.lon])}));
 function rgb(t){
 const stops=modes[activeMode].stops;
 if(t<=stops[0][0])return stops[0][1];
 for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){
  const a=stops[i-1],b=stops[i],q=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0])));
  return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*q));
 }
 return stops[stops.length-1][1];
 }
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  let sum=0,wt=0;const xx=x/scale,yy=y/scale;
  for(const p of pts){const d2=(xx-p.pt.x)**2+(yy-p.pt.y)**2+2000;const q=1/Math.pow(d2,1.05);sum+=q*p.f;wt+=q}
  const [r,g,b]=rgb(sum/wt),i=(y*w+x)*4;im.data[i]=r;im.data[i+1]=g;im.data[i+2]=b;im.data[i+3]=115
 }
 bc.putImageData(im,0,0);ctx.drawImage(buffer,0,0,size.x,size.y);
 ctx.globalCompositeOperation='destination-in';ctx.beginPath();
 function rings(coords){for(const ring of coords){ring.forEach(([lon,lat],i)=>{const p=map.latLngToContainerPoint([lat,lon]);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.closePath()}}
 function shape(g){if(g.type==='Polygon')rings(g.coordinates);else if(g.type==='MultiPolygon')g.coordinates.forEach(rings)}
 shape(texasGeometry);ctx.fillStyle='#fff';ctx.fill();
 ctx.globalCompositeOperation='source-over';
}
map.on('resize zoomend moveend',drawTemperatureGradient);
const countyStyle={color:'#f5f7f9',weight:.48,opacity:.68,fill:false,interactive:false};
const stateStyle={color:'#ffffff',weight:3.1,opacity:1,fill:false,interactive:false};
const census='https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/';
async function geo(layer,where){let p=new URLSearchParams({where,outFields:'*',outSR:'4326',f:'geojson'});let r=await fetch(census+layer+'/query?'+p,{signal:AbortSignal.timeout(11000)});if(!r.ok)throw Error('boundary source');let j=await r.json();if(!j.features?.length)throw Error('empty boundary');return j}
async function boundaries(){
 // Packaged Texas coordinates come from US Atlas TopoJSON (official Census-derived geography).
 // One shared download provides both the state shape and all 254 counties.
 try{
  if(typeof topojson==='undefined')throw Error('TopoJSON library unavailable');
  const r=await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json',{signal:AbortSignal.timeout(16000)});
  if(!r.ok)throw Error('Geography HTTP '+r.status);
  const topo=await r.json();
  const state=topojson.feature(topo,topo.objects.states);
  const texas=state.features.find(f=>String(f.id).padStart(2,'0')==='48');
  if(!texas)throw Error('Texas boundary missing');
  texasGeometry=texas.geometry;
  // Neighboring state outlines are deliberately much softer than the Texas border.
  const nearbyIds=new Set(['04','05','08','20','22','29','35','40']);
  const nearby=state.features.filter(f=>nearbyIds.has(String(f.id).padStart(2,'0')));
  L.geoJSON(nearby,{style:{color:'#e4f0ff',weight:1.05,opacity:.38,fill:false,interactive:false}}).addTo(nearbyStateLayer);
  const counties=topojson.feature(topo,topo.objects.counties).features.filter(f=>String(f.id).padStart(5,'0').startsWith('48'));
  L.geoJSON(counties,{style:{color:'#354959',weight:.75,opacity:.78,fill:false,interactive:false}}).addTo(boundaryLayer);
  L.geoJSON(texas,{style:{color:'#fff',weight:2.9,opacity:1,fill:false,interactive:false}}).addTo(boundaryLayer);
  drawTemperatureGradient();
  status.textContent='Texas boundaries loaded • Waiting for current NWS observations…';
 }catch(e){
  // Alternative source for the same official geography, never draw fictitious county lines.
  try{
   const [state,counties]=await Promise.all([
    fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json',{signal:AbortSignal.timeout(12000)}).then(r=>r.json()),
    geo(1,"STATE='48'")
   ]);
   const nearbyNames=new Set(['New Mexico','Oklahoma','Arkansas','Louisiana','Kansas','Colorado','Missouri','Arizona']);
   L.geoJSON(state.features.filter(f=>nearbyNames.has(f.properties?.name)),{style:{color:'#e4f0ff',weight:1.05,opacity:.38,fill:false,interactive:false}}).addTo(nearbyStateLayer);
   const texas=state.features.find(f=>f.properties?.name==='Texas');
   if(!texas)throw Error('Texas state not found');
   texasGeometry=texas.geometry;
   L.geoJSON(counties,{style:countyStyle}).addTo(boundaryLayer);
   L.geoJSON(texas,{style:stateStyle}).addTo(boundaryLayer);
   drawTemperatureGradient();
  }catch(_){
   status.textContent='Texas boundary feed unavailable; color shading paused rather than misplacing it.';
  }
 }
}
boundaries();
const stations=[["Amarillo","KAMA",35.22,-101.71],["Lubbock","KLBB",33.66,-101.82],["El Paso","KELP",31.81,-106.38],["Midland","KMAF",31.94,-102.2],["Abilene","KABI",32.41,-99.68],["Dallas","KDAL",32.85,-96.85],["Wichita Falls","KSPS",33.99,-98.49],["Waco","KACT",31.61,-97.23],["Austin","KAUS",30.19,-97.67],["San Antonio","KSAT",29.53,-98.47],["Houston","KHOU",29.65,-95.28],["Corpus Christi","KCRP",27.77,-97.5],["Brownsville","KBRO",25.91,-97.43],["Laredo","KLRD",27.54,-99.46],["Tyler","KTYR",32.35,-95.4]];
const markers=L.layerGroup().addTo(map);
async function getStation([name,id,lat,lon]){
 try{
  const response=await fetch('https://api.weather.gov/stations/'+id+'/observations/latest',{headers:{'Accept':'application/geo+json'},signal:AbortSignal.timeout(9500),cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const p=(await response.json()).properties||{};
  const c=p.temperature?.value, stamp=Date.parse(p.timestamp||'');
  if(typeof c!=='number'||!Number.isFinite(c)||!Number.isFinite(stamp)||Date.now()-stamp>90*60000||stamp>Date.now()+60000)return null;
  const dewC=p.dewpoint?.value,rh=p.relativeHumidity?.value,feelsC=p.apparentTemperature?.value;
  return {name,lat,lon,f:Math.round(c*9/5+32),
   dew:typeof dewC==='number'?Math.round(dewC*9/5+32):null,
   rh:typeof rh==='number'&&rh>=0&&rh<=100?Math.round(rh):null,
   feels:typeof feelsC==='number'&&Number.isFinite(feelsC)?Math.round(feelsC*9/5+32):null,stamp};
 }catch(e){return null}
}
async function refreshTemps(){
 status.textContent='Loading fresh NWS temperatures and Texas color shading…';
 const results=[];let cursor=0;
 async function worker(){while(cursor<stations.length){const item=stations[cursor++];const x=await getStation(item);if(x)results.push(x)}}
 await Promise.all(Array.from({length:4},worker));
 observationData=results;setMode(activeMode);
 const latest=results.length?Math.max(...results.map(x=>x.stamp)):null;
 if(results.length&&latest)status.textContent+=` • Latest ${new Date(latest).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'})} CT`;

}
refreshTemps();setInterval(refreshTemps,600000);

// Out-of-state city labels intentionally hidden; neighboring state borders and abbreviations remain.


// NOAA's WPC National Forecast Chart ArcGIS MapServer: real georeferenced
// Day-1 fronts and high/low centers, not an unaligned image or invented features.
// This is a forecast layer, NOT falsely presented as the current surface analysis.
const wpcStatus={set textContent(value){}};
const wpcService='https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/natl_fcst_wx_chart/MapServer';
const wpcFronts=L.layerGroup().addTo(map);
let wpcImages=[];
function drawWpcForecast(){
 const bounds=map.getBounds(), size=map.getSize();
 const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
 const url=new URL(wpcService+'/export');
 url.searchParams.set('bbox',[sw.lng,sw.lat,ne.lng,ne.lat].join(','));
 url.searchParams.set('bboxSR','4326');
 url.searchParams.set('imageSR','4326');
 url.searchParams.set('size',[Math.round(size.x),Math.round(size.y)].join(','));
 url.searchParams.set('layers','show:1,2');
 url.searchParams.set('format','png32');
 url.searchParams.set('transparent','true');
 url.searchParams.set('f','image');
 url.searchParams.set('_',String(Math.floor(Date.now()/900000)));
 const image=L.imageOverlay(url.toString(),bounds,{opacity:1,interactive:false});
 image.on('load',()=>{
  wpcFronts.clearLayers();wpcFronts.addLayer(image);
  wpcStatus.textContent='NOAA WPC • Day 1 forecast fronts & H/L (not current analysis)';
  if(typeof regionalLabelLayer!=='undefined')regionalLabelLayer.eachLayer(l=>{if(l.bringToFront)l.bringToFront()});
 });
 image.on('error',()=>{wpcStatus.textContent='NOAA WPC fronts unavailable • temperature map continues';});
 // Preload image without adding it until success; on success it will be displayed.
 const test=new Image();
 test.onload=()=>image.addTo(map);
 test.onerror=()=>{wpcStatus.textContent='NOAA WPC forecast service unavailable';};
 test.src=url.toString();
}
map.on('moveend zoomend resize',()=>{clearTimeout(window.__wpcRefresh);window.__wpcRefresh=setTimeout(drawWpcForecast,350)});
drawWpcForecast();setInterval(drawWpcForecast,900000);
</script></body></html>
