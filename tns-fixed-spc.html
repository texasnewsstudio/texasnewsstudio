<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNS • SEVERE WEATHER OUTLOOK</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#091a2b;color:#fff;font-family:Arial,sans-serif}#top{height:66px;background:linear-gradient(90deg,#071929,#153650);border-top:4px solid #e52c49;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:10px}#brand{font-weight:1000;font-size:clamp(15px,2.5vw,24px);text-align:center}#brand span{color:#ff5a70}#title{font-weight:900;font-size:clamp(14px,2.2vw,23px);text-align:center}#subtitle{font-size:10px;letter-spacing:.5px;color:#c0d8eb;text-align:center;margin-top:3px}#map{height:calc(100% - 96px);background:#3b5268}#status{height:30px;background:#0c2439;color:#e2f2ff;display:flex;align-items:center;justify-content:center;font-size:12px;padding:4px 10px;text-align:center}.leaflet-control-attribution{font-size:8px!important}.leaflet-container{background:#536575}#fallback{position:absolute;top:75px;left:12px;right:12px;z-index:1200;background:#172b40ed;color:#fff;border-left:4px solid #f1b44b;padding:10px;font-size:12px;display:none}.embed #top{height:52px;padding:4px 9px}.embed #brand{font-size:13px}.embed #title{font-size:14px}.embed #subtitle{display:none}.embed #map{height:calc(100% - 76px)}.embed #status{height:24px;font-size:10px}</style></head><body><header id="top"><div id="brand">TEXAS <span>NEWS</span><br>STUDIO</div><div><div id="title">SEVERE WEATHER OUTLOOK</div><div id="subtitle">NOAA SPC DAY 1 • CURRENT RISK AREAS</div></div></header><div id="map"></div><div id="fallback"></div><div id="status">Preparing Texas map…</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');const status=document.getElementById('status');const fallback=document.getElementById('fallback');const m=L.map('map',{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false}).setView([31.0,-99.2],6);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:12,attribution:'Esri'}).addTo(m);function show(msg){status.textContent=msg}function warn(msg){fallback.textContent=msg;fallback.style.display='block'}const texas=[[36.5,-103],[36.5,-100],[34.56,-100],[34.56,-94.05],[33.57,-94.04],[33.56,-94.48],[33.02,-94.04],[32.48,-94.04],[31.98,-93.53],[31.0,-93.55],[30.1,-93.73],[29.74,-93.86],[29.55,-94.8],[29.35,-95.0],[28.93,-95.3],[28.46,-96.4],[27.83,-97.0],[26.3,-97.4],[25.96,-97.15],[25.85,-97.35],[26.05,-98.15],[26.3,-98.3],[26.4,-99.0],[27.0,-99.45],[27.5,-99.5],[28.0,-100.0],[28.5,-100.2],[29.0,-101.0],[29.6,-101.7],[29.9,-102.4],[29.7,-103.0],[29.3,-103.0],[29.55,-104.3],[30.0,-104.4],[30.65,-105.0],[31.33,-106.65],[31.78,-106.52],[31.78,-103.0],[36.5,-103]];L.polygon(texas,{color:'#e7f4ff',weight:2,fill:false,interactive:false}).addTo(m);const cities=[['Dallas',32.78,-96.8],['Austin',30.27,-97.74],['Houston',29.76,-95.37],['San Antonio',29.42,-98.49],['El Paso',31.76,-106.49],['Lubbock',33.58,-101.85],['Amarillo',35.22,-101.83],['Midland',31.99,-102.08],['Corpus Christi',27.8,-97.4],['Waco',31.55,-97.15]];cities.forEach(([n,a,b])=>L.marker([a,b],{icon:L.divIcon({className:'',html:'<div style="font:700 11px Arial;color:#13273a;text-shadow:0 1px #fff,1px 0 #fff,-1px 0 #fff;white-space:nowrap">● '+n+'</div>',iconSize:[100,14]})}).addTo(m));const url='https://www.spc.noaa.gov/products/outlook/day1otlk_cat.nolyr.geojson';const palette={TSTM:'#b8d8a8',MRGL:'#54a858',SLGT:'#f4dc5c',ENH:'#e99347',MDT:'#e54b4e',HIGH:'#d565c0'};let layer=null;async function update(){show('Requesting current NOAA SPC Day 1 risk polygons…');let controller=new AbortController();let timer=setTimeout(()=>controller.abort(),12000);try{let response=await fetch(url+'?t='+Math.floor(Date.now()/300000),{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);let data=await response.json();if(!data.features||!data.features.length)throw Error('No outlook polygons received');let next=L.geoJSON(data,{style:f=>{let p=f.properties||{};let level=String(p.LABEL||p.label||p.DN||p.dn||p.risk||p.RISK||'').toUpperCase();let key=Object.keys(palette).find(k=>level.includes(k));return{color:'#273749',weight:1.5,fillColor:palette[key]||'#8fc2aa',fillOpacity:.6}}});if(layer)m.removeLayer(layer);layer=next.addTo(m);fallback.style.display='none';show('NOAA SPC Day 1 outlook • source updated on request • valid time in source product')}catch(e){warn('SPC outlook could not be loaded from NOAA ('+e.message+'). No risk areas are displayed.');show('SPC outlook unavailable • map remains visible')}finally{clearTimeout(timer)}}update();setInterval(update,300000);</script></body></html>
